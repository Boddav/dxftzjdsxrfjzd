<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beállítások - AI Trading Advisor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">🤖 AI Trading Advisor</div>
        <div class="nav-links">
            <a href="/">Dashboard</a>
            <a href="/config" class="active">Beállítások</a>
            <a href="/logs">Naplók</a>
        </div>
    </nav>

    <div class="container">
        <h1>Beállítások</h1>

        <div class="section">
            <h2>cTrader API</h2>
            <form id="configForm">
                <div class="form-group">
                    <label for="clientId">Client ID</label>
                    <input type="text" id="clientId" name="clientId" class="form-control" placeholder="cTrader Client ID">
                </div>

                <div class="form-group">
                    <label for="clientSecret">Client Secret</label>
                    <input type="password" id="clientSecret" name="clientSecret" class="form-control" placeholder="Hagyd üresen, ha nem változtatsz">
                </div>

                <div class="form-group">
                    <label for="accountId">Account ID</label>
                    <input type="text" id="accountId" name="accountId" class="form-control" placeholder="cTrader Account ID">
                </div>
            </form>
        </div>

        <div class="section">
            <h2>Claude AI</h2>
            <div class="form-group">
                <label for="anthropicKey">Anthropic API Key</label>
                <input type="password" id="anthropicKey" name="anthropicKey" class="form-control" placeholder="Hagyd üresen, ha nem változtatsz">
            </div>
        </div>

        <div class="section">
            <h2>Kereskedési Paraméterek</h2>
            <div class="form-group">
                <label for="maxPositions">Max. Egyidejű Pozíciók</label>
                <input type="number" id="maxPositions" name="maxPositions" class="form-control" min="1" max="10" value="3">
            </div>

            <div class="form-group">
                <label for="riskPerTrade">Kockázat per Kereskedés (%)</label>
                <input type="number" id="riskPerTrade" name="riskPerTrade" class="form-control" min="0.1" max="5" step="0.1" value="1.0">
            </div>
        </div>

        <div class="form-actions">
            <button type="button" class="btn btn-primary" onclick="saveConfig()">Mentés</button>
            <button type="button" class="btn btn-secondary" onclick="loadConfig()">Visszaállítás</button>
        </div>

        <div id="configMessage" class="message"></div>
    </div>

    <script src="{{ url_for('static', filename='js/config.js') }}"></script>
</body>
</html>
