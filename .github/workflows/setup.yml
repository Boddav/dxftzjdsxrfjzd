name: AI Trading Advisor Setup

on:
  push:
    branches: [ main, claude/* ]
  pull_request:
    branches: [ main ]

jobs:
  setup-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt --ignore-installed PyJWT
      continue-on-error: false

    - name: Lint with flake8 (optional)
      run: |
        pip install flake8
        # Only check for critical syntax errors
        flake8 *.py --count --select=E9,F63,F7,F82 --show-source --statistics || echo "⚠️ Some lint warnings found (non-blocking)"
      continue-on-error: true

    - name: Check file structure
      run: |
        echo "Checking project structure..."
        ls -la
        echo ""
        echo "Main Python files:"
        ls -lh *.py
        echo ""
        echo "Python version:"
        python --version
        echo ""
        echo "Pip version:"
        pip --version

    - name: Validate Python syntax
      run: |
        python -m py_compile ctrader_oauth_setup.py
        python -m py_compile mcp_server.py
        python -m py_compile ai_trading_advisor.py
        python -m py_compile admin_interface.py
        echo "✅ All Python files are syntactically correct!"

    - name: Check dependencies
      run: |
        pip list
        echo ""
        echo "✅ Dependencies installed successfully!"
