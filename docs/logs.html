<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naplók - AI Trading Advisor</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">🤖 AI Trading Advisor</div>
        <div class="nav-links">
            <a href="index.html">Dashboard</a>
            <a href="config.html">Beállítások</a>
            <a href="logs.html" class="active">Naplók</a>
            <a href="https://github.com/Boddav/dxftzjdsxrfjzd" target="_blank">GitHub</a>
        </div>
    </nav>

    <div class="container">
        <div class="header">
            <h1>Rendszer Naplók</h1>
            <button class="btn btn-secondary" onclick="refreshLogs()">🔄 Frissítés</button>
        </div>

        <div class="connection-status" id="connectionStatus">
            <span class="status-indicator offline"></span>
            <span id="connectionText">Kapcsolódás az API-hoz...</span>
        </div>

        <div class="section">
            <div class="log-filters">
                <label>
                    <input type="checkbox" id="filterInfo" checked> INFO
                </label>
                <label>
                    <input type="checkbox" id="filterWarning" checked> WARNING
                </label>
                <label>
                    <input type="checkbox" id="filterError" checked> ERROR
                </label>
            </div>

            <div id="logsContainer" class="logs-container">
                <div class="no-data">Naplók betöltése...</div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>AI Trading Advisor © 2026 | Powered by Claude AI & cTrader</p>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/logs.js"></script>
</body>
</html>
